name = "desci-dashboard"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

# KV binding for the response cache. The id below is a placeholder — replace
# it with your real namespace id from `wrangler kv namespace list`, OR bind it
# in the Cloudflare dashboard under Pages → Settings → Functions → KV bindings
# and you can leave this section commented out.
#
[[kv_namespaces]]
binding = "CACHE"
id = "11ddecae178d487d89aef9671d86a1de"

# D1 database for the news aggregator. Create with:
#   wrangler d1 create desci-news
# then paste the database_id below (or bind in the dashboard under Pages →
# Settings → Functions → D1 database bindings, in which case this section
# can be left commented out).
[[d1_databases]]
binding = "DB"
database_name = "desci-news"
database_id = "929528ca-cdf3-4cd2-9260-27ee3f9afea5"
