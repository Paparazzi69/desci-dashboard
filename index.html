<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeSci — Decentralized Science Token Dashboard</title>
<meta name="description" content="Live token tracker for the Decentralized Science (DeSci) crypto narrative. Real prices, real feeds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* ── Bubble map section ── */
  .bubblemap-section {
    margin-bottom: 24px;
  }
  .bubblemap-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .bubblemap-title {
    color: var(--text3);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .bubblemap-line {
    flex: 1;
    height: 1px;
    background: var(--border2, #1a2d3a);
  }
  .bubblemap-hint {
    color: var(--text3);
    font-size: 11px;
    white-space: nowrap;
  }
  #bubblemap-mount {
    height: 360px;
    background: var(--surface, #111820);
    border: 1px solid var(--border2, #1a2d3a);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  @keyframes pulse {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.85)}
  }
  /* ── Header nav (single stadium container, 3 sections) ──
     One unified pill with subtle green outer halo. Three buttons inside
     separated by thin dividers. Each button gets its own hover state but
     the container stays cohesive — they read as ONE thing, not three. */
  .header-nav {
    display: inline-flex;
    align-items: stretch;
    border: 1px solid rgba(61,232,160,0.28);
    border-radius: 28px;
    overflow: hidden;
    background: rgba(13, 22, 26, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    box-shadow:
      0 0 0 4px rgba(61,232,160,0.04),
      0 8px 28px rgba(61,232,160,0.06),
      inset 0 0 24px rgba(61,232,160,0.025);
  }
  .header-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 22px;
    color: var(--text, #d8eae5);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.01em;
    border-right: 1px solid rgba(61,232,160,0.16);
    transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .header-nav-link:last-child { border-right: none; }
  .header-nav-link:hover {
    background: rgba(61,232,160,0.09);
    color: var(--green, #3de8a0);
  }
  .header-nav-link svg { flex-shrink: 0; }
  .header-nav-arrow {
    color: var(--text3, #4a6470);
    transition: color 0.15s, transform 0.15s;
    line-height: 1;
    margin-left: 2px;
    font-size: 12px;
  }
  .header-nav-link:hover .header-nav-arrow {
    color: var(--green, #3de8a0);
    transform: translate(1px, -1px);
  }
  @media (max-width: 720px) {
    .header-nav-link { padding: 8px 14px; font-size: 12px; gap: 7px; }
    .header-nav-link span:not(.header-nav-arrow) { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="layout">
  <main class="main" id="main">
    <header class="page-header">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="var(--green-bg)"/>
          <path d="M 10 6 Q 18 12 26 6" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 10 11 Q 18 17 26 11" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M 10 16 Q 18 22 26 16" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 10 21 Q 18 27 26 21" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M 10 26 Q 18 32 26 26" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <line x1="14" y1="6" x2="14" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
          <line x1="22" y1="6" x2="22" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
        </svg>
        <div>
          <div class="brand-title">
            <span class="brand-name">DeSci</span>
            <span class="brand-sub">Sector Dashboard</span>
          </div>
          <div class="brand-tagline" id="brand-tagline">Decentralized Science</div>
        </div>
      </div>
      <nav class="header-nav" aria-label="Primary">
        <a class="header-nav-link" href="/feed">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 11a9 9 0 0 1 9 9"/>
            <path d="M4 4a16 16 0 0 1 16 16"/>
            <circle cx="5" cy="19" r="1.5" fill="currentColor"/>
          </svg>
          <span>Feed</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="header-nav-link"
           href="https://x.com/DeSciDashboard"
           target="_blank" rel="noopener noreferrer">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.745l7.74-8.842L1.254 2.25H8.08l4.253 5.622 5.911-5.622Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          <span>Socials</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="header-nav-link"
           href="https://kickstart.easya.io/token/3AxTzPD5H6JTjrXgkBqtp9wYpB3fhp2zX2v1zpjKHhu3"
           target="_blank" rel="noopener noreferrer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
          <span>EasyA Kickstart</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <div class="status">
        <div class="live-dot" id="live-dot" data-state="loading">
          <span class="live-dot-orb"></span>
          <span class="live-dot-label">LOADING</span>
        </div>
        <div class="mono status-time" id="status-time">—</div>
      </div>
    </header>

    <div id="banner-mount"></div>

    <section class="sector-summary" id="sector-summary" aria-label="Sector summary">
      <!-- 5 SectorCards injected -->
    </section>

    <!-- ── Bubble Map ── -->
    <div class="bubblemap-section">
      <div class="bubblemap-header">
        <span class="bubblemap-title">Sector Bubble Map</span>
        <span class="bubblemap-line"></span>
        <span class="bubblemap-hint">Size = market cap · Color = 24h · Click to explore</span>
      </div>
      <div id="bubblemap-mount"></div>
    </div>

    <div class="section-divider">
      <span>Token Index</span>
      <span class="section-divider-line"></span>
    </div>

    <div class="filter-chips" id="filter-chips" role="tablist" aria-label="Filter tokens by narrative">
      <!-- chips injected -->
    </div>

    <div class="token-table-wrap">
      <div class="token-table" id="token-table" role="table" aria-label="DeSci tokens">
        <div class="token-thead" role="row" id="token-thead"></div>
        <div class="token-tbody" id="token-tbody" aria-live="polite"></div>
      </div>
    </div>

    <section class="milestones" id="milestones" aria-label="Research milestones">
      <!-- timeline injected -->
    </section>

    <footer class="page-footer">
      <div>Data is indicative · Prices in USD · Not financial advice</div>
    </footer>
  </main>
</div>

<div id="drawer-mount" aria-live="polite"></div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
