<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeSci — Feed</title>
<meta name="description" content="Live Twitter and news feed from the Decentralized Science (DeSci) ecosystem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/feed.css">
<style>
  /* feed.html overrides — page is its own scroll container */
  html, body { height: 100%; overflow: hidden; }
</style>
</head>
<body>

<div class="feed-page">
  <!-- ── Left rail ── -->
  <aside class="feed-rail">
    <a class="feed-rail-back" href="/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <div class="feed-rail-brand">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="var(--green-bg)"/>
        <path d="M 10 6 Q 18 12 26 6" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 10 11 Q 18 17 26 11" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 10 16 Q 18 22 26 16" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 10 21 Q 18 27 26 21" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 10 26 Q 18 32 26 26" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <line x1="14" y1="6" x2="14" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
        <line x1="22" y1="6" x2="22" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
      </svg>
      <div>
        <div class="feed-rail-brand-name">DeSci</div>
        <div class="feed-rail-brand-sub">Feed</div>
      </div>
    </div>

    <div class="feed-rail-divider"></div>
    <div class="feed-rail-section-label">Tracked Accounts</div>
    <div id="feed-rail-accounts">
      <!-- injected by feed.js once we know which accounts the API returned -->
    </div>
  </aside>

  <!-- ── Main feed ── -->
  <main class="feed-main">
    <header class="feed-header">
      <div class="feed-header-row">
        <span class="feed-title">Feed</span>
        <button class="feed-refresh" id="feed-refresh" type="button" aria-label="Refresh feed">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
      <div class="feed-filter-row" role="tablist" aria-label="Filter posts by source">
        <button class="filter-pill active" data-filter="all" type="button" role="tab" aria-selected="true">
          All <span class="filter-pill-count" id="count-all"></span>
        </button>
        <button class="filter-pill" data-filter="tweet" type="button" role="tab" aria-selected="false">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.745l7.74-8.842L1.254 2.25H8.08l4.253 5.622 5.911-5.622Zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
          Twitter <span class="filter-pill-count" id="count-tweet"></span>
        </button>
        <button class="filter-pill" data-filter="news" type="button" role="tab" aria-selected="false">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/>
            <path d="M18 14h-8"/><path d="M15 18h-5"/>
            <path d="M10 6h8v4h-8V6z"/>
          </svg>
          News <span class="filter-pill-count" id="count-news"></span>
        </button>
      </div>
    </header>

    <div id="feed-banner-mount"></div>
    <div class="feed-list" id="feed-list">
      <div class="feed-loading">Loading feed…</div>
    </div>
  </main>
</div>

<script type="module" src="/assets/js/feed.js"></script>
</body>
</html>
