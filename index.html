<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeSci — Decentralized Science Token Dashboard</title>
<meta name="description" content="Live token tracker for the Decentralized Science (DeSci) crypto narrative. Real prices, real feeds.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<style>
  /* ── Bubble map section ── */
  .bubblemap-section {
    margin-bottom: 24px;
  }
  .bubblemap-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .bubblemap-title {
    color: var(--text3);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .bubblemap-line {
    flex: 1;
    height: 1px;
    background: var(--border2, #1a2d3a);
  }
  .bubblemap-hint {
    color: var(--text3);
    font-size: 11px;
    white-space: nowrap;
  }
  #bubblemap-mount {
    height: 360px;
    background: var(--surface, #111820);
    border: 1px solid var(--border2, #1a2d3a);
    border-radius: 10px;
    overflow: hidden;
    position: relative;
  }
  @keyframes pulse {
    0%,100%{opacity:1;transform:scale(1)}
    50%{opacity:.5;transform:scale(.85)}
  }
  /* ── Header nav (3 unified pills: Feed / X / EasyA) ──
     One visual style across all three so nothing competes for attention.
     Light border for visibility against the page glow, brightens on hover. */
  .header-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .header-nav-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 22px;
    border: 1px solid var(--border, #1e2d38);
    background: rgba(255,255,255,0.015);
    color: var(--text, #d8eae5);
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    letter-spacing: 0.01em;
    transition: border-color 0.15s, background 0.15s, color 0.15s, transform 0.15s;
    white-space: nowrap;
  }
  .header-nav-link:hover {
    border-color: rgba(61,232,160,0.45);
    background: rgba(61,232,160,0.06);
    color: var(--green, #3de8a0);
    transform: translateY(-1px);
  }
  .header-nav-link .header-nav-arrow {
    color: var(--text3, #4a6470);
    transition: transform 0.15s, color 0.15s;
    line-height: 1;
    margin-left: 1px;
  }
  .header-nav-link:hover .header-nav-arrow {
    color: var(--green, #3de8a0);
    transform: translate(1px, -1px);
  }
  @media (max-width: 720px) {
    .header-nav-link { padding: 6px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="layout">
  <main class="main" id="main">
    <header class="page-header">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="8" fill="var(--green-bg)"/>
          <path d="M 10 6 Q 18 12 26 6" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 10 11 Q 18 17 26 11" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M 10 16 Q 18 22 26 16" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <path d="M 10 21 Q 18 27 26 21" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
          <path d="M 10 26 Q 18 32 26 26" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
          <line x1="14" y1="6" x2="14" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
          <line x1="22" y1="6" x2="22" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
        </svg>
        <div>
          <div class="brand-title">
            <span class="brand-name">DeSci</span>
            <span class="brand-sub">Sector Dashboard</span>
          </div>
          <div class="brand-tagline" id="brand-tagline">Decentralized Science</div>
        </div>
      </div>
      <nav class="header-nav" aria-label="Primary">
        <a class="header-nav-link" href="/feed">
          <span>Feed</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="header-nav-link"
           href="https://x.com/DeSciDashboard"
           target="_blank" rel="noopener noreferrer">
          <span>X / Twitter</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
        <a class="header-nav-link"
           href="https://kickstart.easya.io/token/3AxTzPD5H6JTjrXgkBqtp9wYpB3fhp2zX2v1zpjKHhu3"
           target="_blank" rel="noopener noreferrer">
          <span>EasyA Kickstart</span>
          <span class="header-nav-arrow" aria-hidden="true">↗</span>
        </a>
      </nav>
      <div class="status">
        <div class="live-dot" id="live-dot" data-state="loading">
          <span class="live-dot-orb"></span>
          <span class="live-dot-label">LOADING</span>
        </div>
        <div class="mono status-time" id="status-time">—</div>
      </div>
    </header>

    <div id="banner-mount"></div>

    <section class="sector-summary" id="sector-summary" aria-label="Sector summary">
      <!-- 5 SectorCards injected -->
    </section>

    <!-- ── Bubble Map ── -->
    <div class="bubblemap-section">
      <div class="bubblemap-header">
        <span class="bubblemap-title">Sector Bubble Map</span>
        <span class="bubblemap-line"></span>
        <span class="bubblemap-hint">Size = market cap · Color = 24h · Click to explore</span>
      </div>
      <div id="bubblemap-mount"></div>
    </div>

    <div class="section-divider">
      <span>Token Index</span>
      <span class="section-divider-line"></span>
    </div>

    <div class="filter-chips" id="filter-chips" role="tablist" aria-label="Filter tokens by narrative">
      <!-- chips injected -->
    </div>

    <div class="token-table-wrap">
      <div class="token-table" id="token-table" role="table" aria-label="DeSci tokens">
        <div class="token-thead" role="row" id="token-thead"></div>
        <div class="token-tbody" id="token-tbody" aria-live="polite"></div>
      </div>
    </div>

    <section class="milestones" id="milestones" aria-label="Research milestones">
      <!-- timeline injected -->
    </section>

    <footer class="page-footer">
      <div>Data is indicative · Prices in USD · Not financial advice</div>
    </footer>
  </main>
</div>

<div id="drawer-mount" aria-live="polite"></div>

<script type="module" src="/assets/js/app.js"></script>
</body>
</html>
