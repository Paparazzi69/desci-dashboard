<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeSci News Feed, Curated with Editorial Takes</title>
<meta name="description" content="Curated DeSci sector news with editorial commentary. Project-native sources, papers, and media filtered for crypto investors.">
<link rel="icon" type="image/png" href="/branding/icon-v1.png" />
<link rel="apple-touch-icon" href="/branding/icon-v1.png" />
<link rel="canonical" href="https://descidash.com/feed" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="DeSci Analytics Hub" />
<meta property="og:title" content="DeSci News Feed, Curated with Editorial Takes" />
<meta property="og:description" content="Curated DeSci sector news with editorial commentary. Project-native sources, papers, and media filtered for crypto investors." />
<meta property="og:url" content="https://descidash.com/feed" />
<meta property="og:image" content="https://descidash.com/branding/header-v1.png" />
<meta property="og:image:width" content="1500" />
<meta property="og:image:height" content="500" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:site" content="@DeSciDashboard" />
<meta name="twitter:title" content="DeSci News Feed, Curated with Editorial Takes" />
<meta name="twitter:description" content="Curated DeSci sector news with editorial commentary. Project-native sources, papers, and media filtered for crypto investors." />
<meta name="twitter:image" content="https://descidash.com/branding/header-v1.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/feed.css">
<style>
  /* feed.html overrides — page is its own scroll container */
  html, body { height: 100%; overflow: hidden; }
</style>
</head>
<body>

<div class="feed-page">
  <!-- ── Left rail ── -->
  <aside class="feed-rail">
    <a class="feed-rail-back" href="/">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/>
      </svg>
      <span>Dashboard</span>
    </a>

    <div class="feed-rail-brand">
      <svg width="28" height="28" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <rect width="36" height="36" rx="8" fill="var(--green-bg)"/>
        <path d="M 10 6 Q 18 12 26 6" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 10 11 Q 18 17 26 11" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 10 16 Q 18 22 26 16" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <path d="M 10 21 Q 18 27 26 21" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.6"/>
        <path d="M 10 26 Q 18 32 26 26" stroke="var(--green)" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <line x1="14" y1="6" x2="14" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
        <line x1="22" y1="6" x2="22" y2="30" stroke="var(--green)" stroke-width="1" opacity="0.25"/>
      </svg>
      <div>
        <div class="feed-rail-brand-name">DeSci</div>
        <div class="feed-rail-brand-sub">News</div>
      </div>
    </div>
  </aside>

  <!-- ── Main feed ── -->
  <main class="feed-main">
    <header class="feed-header">
      <div class="feed-header-row">
        <span class="feed-title">News</span>
        <button class="feed-refresh" id="feed-refresh" type="button" aria-label="Refresh news">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          <span>Refresh</span>
        </button>
      </div>
    </header>

    <div class="feed-list" id="feed-list">
      <div class="feed-loading">Loading news…</div>
    </div>
  </main>
</div>

<script type="module" src="/assets/js/feed.js"></script>
</body>
</html>
