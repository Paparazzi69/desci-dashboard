meta:
  page_title: The Verified 13
  marker: verified sector map
  intro: Thirteen DeSci projects whose claims survive a source check. Every cell traces to a dated public source. Empty cells stay empty. This is curation, not a leaderboard.
  legend: Each badge links to its proof. A Peer-reviewed badge means the project is named in a peer-reviewed journal article and links directly to it. Blank means no verifiable data, not zero. A risk flag marks a documented incident. A cell goes stale after 60 days.
  methodology: every claim traces to a dated public source. a Peer-reviewed badge requires a direct link to a peer-reviewed journal article that names the project. preprints are shown as a separate lower tier. no composite score, no letter grades. staleness window 60 days.
  last_full_sweep: May 2026

